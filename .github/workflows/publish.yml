name: Gated npm release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  prepare:
    # Keep disabled until release approval, stable Push Guard, npm trust and
    # required-reviewer protection on the npm environment are all configured.
    if: ${{ vars.ENABLE_NPM_PUBLISH == 'true' && !github.event.release.prerelease }}
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.artifact.outputs.sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Require a stable tag already merged into main
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node <<'JS'
          const {version} = require('./package.json');
          if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== 'v' + version)
            throw new Error('A matching stable release tag is required');
          JS
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
          firewall-version: '1.15.4'
      - name: Require released Push Guard protection
        run: |
          sfw pip install --require-hashes --only-binary=:all: --no-deps -r .github/requirements/push-guard.txt
      - run: npm test
      - name: Scan complete package with required private terms
        id: guard
        env:
          REQUIRE_PRIVATE_TERMS: 'true'
          PUSH_GUARD_BLOCKED_TERMS: ${{ secrets.PUSH_GUARD_BLOCKED_TERMS }}
        run: bash .github/scripts/check-package.sh origin/main
      - name: Stage the exact scanned tarball and record its digest
        id: artifact
        env:
          TARBALL: ${{ steps.guard.outputs.tarball }}
        run: |
          mkdir -p "$RUNNER_TEMP/scanned-npm"
          cp -- "$TARBALL" "$RUNNER_TEMP/scanned-npm/release.tgz"
          digest=$(sha256sum "$RUNNER_TEMP/scanned-npm/release.tgz")
          printf 'sha256=%s\n' "${digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: scanned-npm-release
          path: ${{ runner.temp }}/scanned-npm/release.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: prepare
    if: ${{ vars.ENABLE_NPM_PUBLISH == 'true' && !github.event.release.prerelease }}
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, dependency install, package scripts or tests in this job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: publish-input
          digest-mismatch: error
      - name: Verify the scanned tarball digest
        env:
          EXPECTED_SHA256: ${{ needs.prepare.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ -f publish-input/release.tgz && ! -L publish-input/release.tgz ]]
          printf '%s  publish-input/release.tgz\n' "$EXPECTED_SHA256" | sha256sum --check --strict
      - name: Publish the verified tarball through npm trusted publishing
        run: npm publish ./publish-input/release.tgz --provenance --access public --ignore-scripts
